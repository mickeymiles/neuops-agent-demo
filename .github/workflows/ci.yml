# ═══════════════════════════════════════════
# CI/CD：静态检查 → 单测 → 镜像构建 → SSH 自动部署（闭环）
# 触发：push 到 main / PR / 手动
# 说明：deploy job 仅在 main push 且 CI 全绿时自动部署到生产服务器
# ═══════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: neuops-agent-demo
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Ruff lint
        # E501 行长忽略；E402/E701/E702/E731/E741/F811 为项目有意兼容写法
        run: ruff check app/ --select E,F --ignore E501,E402,E701,E702,E731,E741,F811

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint
    # PR 不推送镜像，仅验证构建
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production (122.51.98.98)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to server (rsync)
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.github' \
            --exclude='chroma_data' --exclude='uploads' \
            --exclude='*.db' --exclude='__pycache__' \
            --exclude='.venv' --exclude='venv' \
            --exclude='*.log' --exclude='backup_deploy_*' --exclude='.pytest_cache' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Install deps, restart & health check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && bash scripts/remote_deploy.sh"

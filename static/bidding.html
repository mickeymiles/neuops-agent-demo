<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投标工作台 — 道衍</title>
<style>
:root {
  --bg: #0B1220; --panel: #111A2C; --panel2: #0F172A;
  --border: #1E293B; --border2: #334155;
  --text: #E2E8F0; --sub: #94A3B8; --dim: #64748B;
  --primary: #38BDF8; --primary-bg: rgba(56,189,248,.12);
  --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; }
header { display:flex; align-items:center; gap:14px; padding:14px 24px;
  background:var(--panel2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
header h1 { font-size:17px; font-weight:700; }
header .back { color:var(--primary); cursor:pointer; font-size:13px; text-decoration:none; margin-left:auto; }
.container { max-width:1100px; margin:0 auto; padding:24px; }
.hidden { display:none !important; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px;
  border:1px solid var(--border2); background:var(--panel); color:var(--text); cursor:pointer; font-size:13px; }
.btn:hover { border-color:var(--primary); color:var(--primary); }
.btn-primary { background:var(--primary); border-color:var(--primary); color:#062033; font-weight:600; }
.btn-primary:hover { opacity:.9; color:#062033; }
.btn-danger { border-color:rgba(239,68,68,.5); color:var(--danger); }
.btn-sm { padding:4px 10px; font-size:12px; border-radius:6px; }
input, select, textarea { width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border2);
  background:var(--panel2); color:var(--text); font-size:13px; outline:none; }
input:focus, select:focus, textarea:focus { border-color:var(--primary); }
label { display:block; font-size:12px; color:var(--sub); margin-bottom:6px; }
.grid { display:grid; gap:12px; }
.grid-2 { grid-template-columns:1fr 1fr; }
.grid-3 { grid-template-columns:1fr 1fr 1fr; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
.card h2 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.card h2 .tag { font-size:11px; color:var(--sub); font-weight:400; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
th { color:var(--sub); font-weight:500; font-size:12px; }
tr:hover td { background:rgba(56,189,248,.04); }
.status { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; background:var(--primary-bg); color:var(--primary); }
.status.done { background:rgba(16,185,129,.12); color:var(--success); }
.status.warn { background:rgba(245,158,11,.12); color:var(--warning); }
.status.danger { background:rgba(239,68,68,.12); color:var(--danger); }
.mt { margin-top:16px; } .mt8 { margin-top:8px; } .mb8 { margin-bottom:8px; }
.sec { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px; background:var(--panel2); }
.sec h3 { font-size:13px; margin-bottom:8px; color:var(--primary); }
.sec p { font-size:12.5px; color:var(--sub); line-height:1.7; }
.sec .item { padding:6px 0; border-bottom:1px dashed var(--border); }
.sec .item:last-child { border-bottom:none; }
.sec .item b { color:var(--text); }
.meta { display:flex; gap:18px; flex-wrap:wrap; color:var(--sub); font-size:13px; margin-bottom:14px; }
.meta span b { color:var(--text); }
.file-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.file-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-row .size { color:var(--dim); font-size:12px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
.doc-preview { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:14px;
  white-space:pre-wrap; font-size:12.5px; line-height:1.7; max-height:360px; overflow:auto; color:var(--sub); }
.result-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-size:11px; }
.empty { color:var(--dim); text-align:center; padding:40px 0; }
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:10px 20px; border-radius:8px;
  background:var(--panel); border:1px solid var(--border2); color:var(--text); z-index:99; font-size:13px; }
.toast.ok { border-color:var(--success); color:var(--success); }
.toast.err { border-color:var(--danger); color:var(--danger); }
</style>
</head>
<body>
<header>
  <h1>投标工作台</h1>
  <span style="font-size:12px;color:var(--dim);">规范书拆标 · 材料生成 · 合规自检 · 成果导出</span>
  <a class="back" href="/">&larr; 返回智能体平台</a>
</header>

<div class="container">
  <!-- ═══════ 项目列表 ═══════ -->
  <div id="view-list">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="font-size:16px;">投标项目</h2>
      <button class="btn btn-primary" onclick="showCreate()">+ 新建项目</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>项目名称</th><th>招标方</th><th>行业</th><th>预算(万)</th><th>截止时间</th><th>状态</th><th style="width:120px;">操作</th></tr></thead>
        <tbody id="project-tbody"></tbody>
      </table>
      <div id="list-empty" class="empty">暂无项目，点击右上角「新建项目」开始</div>
    </div>
  </div>

  <!-- ═══════ 新建项目 ═══════ -->
  <div id="view-create" class="hidden">
    <div class="card" style="max-width:640px;margin:40px auto;">
      <h2>新建投标项目</h2>
      <div class="grid">
        <div><label>项目名称 *</label><input id="c-name" placeholder="如：某市政务云平台运维服务采购"></div>
        <div class="grid grid-2">
          <div><label>招标方</label><input id="c-tenderee" placeholder="招标单位"></div>
          <div><label>行业</label><select id="c-industry"><option value="">请选择</option><option>政务</option><option>金融</option><option>医疗</option><option>教育</option><option>企业</option><option>其他</option></select></div>
        </div>
        <div class="grid grid-2">
          <div><label>预算金额（万元）</label><input id="c-budget" type="number" placeholder="0"></div>
          <div><label>投标截止时间</label><input id="c-deadline" type="date"></div>
        </div>
      </div>
      <div class="actions mt">
        <button class="btn btn-primary" onclick="doCreate()">创建</button>
        <button class="btn" onclick="showList()">取消</button>
      </div>
    </div>
  </div>

  <!-- ═══════ 项目详情 ═══════ -->
  <div id="view-detail" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 id="d-title" style="font-size:16px;"></h2>
      <div class="actions">
        <button class="btn btn-sm" onclick="showList()">&larr; 返回列表</button>
        <button class="btn btn-sm btn-danger" onclick="delProject()">删除项目</button>
      </div>
    </div>

    <div class="card">
      <h2>项目信息 <span class="tag" id="d-status"></span></h2>
      <div class="meta" id="d-meta"></div>
      <div class="actions">
        <button class="btn btn-sm" onclick="saveMeta()">保存修改</button>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2>规范书上传 <span class="tag">docx / pdf / xlsx / txt</span></h2>
        <input type="file" id="file-input" multiple accept=".docx,.pdf,.xlsx,.txt,.md">
        <button class="btn btn-primary btn-sm mt8" onclick="uploadFiles()">上传并抽取文本</button>
        <div id="file-list" class="mt8"></div>
      </div>

      <div class="card">
        <h2>拆标解析 <span class="tag">规则粗筛 + LLM 精提炼</span></h2>
        <button class="btn btn-primary btn-sm" onclick="doParse()">触发拆标</button>
        <p style="font-size:12px;color:var(--dim);margin-top:8px;">输出：资质 / 业绩 / 技术参数 / 评分标准 / 废标条款 / 应答清单 六类结构化报告</p>
        <div id="parse-out" class="mt8"></div>
      </div>
    </div>

    <div class="card">
      <h2>材料生成 <span class="tag">拆标报告 + 知识库 + 模板</span></h2>
      <div class="actions">
        <button class="btn btn-sm" onclick="doGenerate('tech_proposal')">技术方案建议书</button>
        <button class="btn btn-sm" onclick="doGenerate('response')">招标点对点应答</button>
        <button class="btn btn-sm" onclick="doGenerate('ppt_outline')">售前汇报 PPT 大纲</button>
        <button class="btn btn-sm" onclick="doGenerate('impl_plan')">运维实施方案</button>
      </div>
      <div id="gen-out" class="mt8"></div>
    </div>

    <div class="card">
      <h2>合规自检 <span class="tag">未响应项 / 废标红线 / 评分建议</span></h2>
      <button class="btn btn-primary btn-sm" onclick="doCheck()">执行自检</button>
      <div id="check-out" class="mt8"></div>
    </div>

    <div class="card">
      <h2>生成成果与导出</h2>
      <div id="docs-out" class="empty">暂无生成成果</div>
    </div>
  </div>
</div>

<script>
let S = { view:'list', pid:null, project:null };

function toast(msg, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(s) { return s ? String(s).slice(0,10) : '-'; }
function statusClass(st) {
  if (['已生成','已自检','已导出'].includes(st)) return 'done';
  if (st === '已拆标') return '';
  return st === '已上传' ? 'warn' : '';
}

function showList() { S.view='list'; hideAll(); document.getElementById('view-list').classList.remove('hidden'); loadProjects(); }
function showCreate() { S.view='create'; hideAll(); document.getElementById('view-create').classList.remove('hidden'); }
function showDetail(pid) { S.view='detail'; S.pid=pid; hideAll(); document.getElementById('view-detail').classList.remove('hidden'); loadProject(pid); }
function hideAll() { ['view-list','view-create','view-detail'].forEach(id => document.getElementById(id).classList.add('hidden')); }

async function api(url, opt) {
  const r = await fetch(url, opt);
  return r.json();
}

async function loadProjects() {
  const r = await api('/api/bid/projects');
  const tbody = document.getElementById('project-tbody');
  const empty = document.getElementById('list-empty');
  const list = r.projects || [];
  empty.classList.toggle('hidden', list.length > 0);
  tbody.innerHTML = list.map(p => `
    <tr onclick="showDetail(${p.id})" style="cursor:pointer;">
      <td><b>${esc(p.name)}</b></td>
      <td>${esc(p.tenderee) || '-'}</td>
      <td>${esc(p.industry) || '-'}</td>
      <td>${p.budget || 0}</td>
      <td>${fmtDate(p.deadline)}</td>
      <td><span class="status ${statusClass(p.status)}">${esc(p.status)}</span></td>
      <td><button class="btn btn-sm" onclick="event.stopPropagation();showDetail(${p.id})">进入</button></td>
    </tr>`).join('');
}

async function doCreate() {
  const name = document.getElementById('c-name').value.trim();
  if (!name) return toast('请填写项目名称', false);
  const r = await api('/api/bid/projects', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, tenderee: document.getElementById('c-tenderee').value,
      industry: document.getElementById('c-industry').value,
      budget: parseFloat(document.getElementById('c-budget').value) || 0,
      deadline: document.getElementById('c-deadline').value })
  });
  if (r.success) { toast('项目已创建', true); showDetail(r.project.id); }
  else toast(r.error || '创建失败', false);
}

async function loadProject(pid) {
  const r = await api('/api/bid/projects/' + pid);
  if (!r.success) return showList();
  S.project = r.project; const p = r.project;
  document.getElementById('d-title').textContent = p.name;
  document.getElementById('d-status').innerHTML = `<span class="status ${statusClass(p.status)}">${esc(p.status)}</span>`;
  document.getElementById('d-meta').innerHTML = `
    <span>招标方：<b>${esc(p.tenderee) || '-'}</b></span>
    <span>行业：<b>${esc(p.industry) || '-'}</b></span>
    <span>预算：<b>${p.budget || 0} 万</b></span>
    <span>截止：<b>${fmtDate(p.deadline)}</b></span>`;
  renderFiles(p.files || []);
  renderParse(p.parse_report);
  renderDocs(p.generated_docs || []);
  renderCheck(p.check_result);
}

async function saveMeta() {
  const p = S.project;
  const r = await api('/api/bid/projects/' + S.pid, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ tenderee: prompt('招标方', p.tenderee || ''),
      deadline: prompt('投标截止时间(YYYY-MM-DD)', (p.deadline||'').slice(0,10)) })
  });
  if (r.success) { toast('已保存', true); loadProject(S.pid); }
  else toast(r.error, false);
}

async function delProject() {
  if (!confirm('确认删除该项目？关联文件将一并删除。')) return;
  const r = await api('/api/bid/projects/' + S.pid, { method:'DELETE' });
  toast('已删除', r.success); showList();
}

async function uploadFiles() {
  const input = document.getElementById('file-input');
  if (!input.files.length) return toast('请先选择文件', false);
  const fd = new FormData();
  for (const f of input.files) fd.append('files', f);
  const r = await api('/api/bid/projects/' + S.pid + '/upload', { method:'POST', body: fd });
  if (r.success) { toast(`已上传 ${r.saved.length} 个文件`, true); input.value=''; loadProject(S.pid); }
  else toast(r.error || '上传失败', false);
}

function renderFiles(files) {
  const el = document.getElementById('file-list');
  if (!files.length) { el.innerHTML = '<p style="color:var(--dim);font-size:12px;">尚未上传规范书</p>'; return; }
  el.innerHTML = files.map(f => `
    <div class="file-row"><span class="name">📄 ${esc(f.name)}</span><span class="size">${(f.size/1024).toFixed(1)} KB</span></div>`).join('');
}

async function doParse() {
  const btn = event.target; btn.disabled = true; btn.textContent = '拆标中...';
  try {
    const r = await api('/api/bid/projects/' + S.pid + '/parse', { method:'POST' });
    if (r.success) { toast('拆标完成', true); renderParse(r.report); }
    else toast(r.error || '拆标失败', false);
  } finally { btn.disabled = false; btn.textContent = '触发拆标'; }
}

const SEC_META = {
  qualifications:['资质要求','资质','等级','证明'],
  performance:['业绩要求','业绩','量化要求','证明'],
  tech_params:['技术参数','参数项','要求值','验收'],
  scoring:['评分标准','评分项','分值','说明'],
  rejection_clauses:['废标条款','废标 / 否决条款'],
  response_checklist:['应答清单','应答材料','材料类型'],
};

function renderParse(report) {
  const el = document.getElementById('parse-out');
  if (!report || !Object.keys(report).length) { el.innerHTML = ''; return; }
  el.innerHTML = Object.entries(SEC_META).map(([k, meta]) => {
    const items = report[k] || [];
    const body = items.map(it => {
      if (k === 'rejection_clauses') return `<div class="item">${esc(it)}</div>`;
      if (k === 'response_checklist') return `<div class="item"><b>${esc(it.id || '')}</b> ${esc(it.item || '')} · 材料：${esc(it.doc_type || '')} · 状态：${esc(it.status || '')}</div>`;
      const parts = [it.item, it.level, it.value, it.score && `满分 ${it.score}`, it.requirement, it.acceptance, it.notes, it.required_docs]
        .filter(x => x && x !== '未识别');
      return `<div class="item"><b>${esc(parts[0] || it.item || '未识别')}</b>${parts.slice(1).map(x => ` · ${esc(x)}`).join('')}${it.is_key ? ' <span class="result-badge" style="background:rgba(245,158,11,.12);color:var(--warning);">关键项</span>' : ''}</div>`;
    }).join('');
    const n = items.length ? `${items.length} 项` : '未识别';
    return `<div class="sec"><h3>${meta[0]} <span style="color:var(--dim);font-weight:400;">${n}</span></h3>${body || '<p>未识别</p>'}</div>`;
  }).join('');
}

async function doGenerate(type) {
  const r = await api('/api/bid/projects/' + S.pid + '/generate', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type })
  });
  if (r.success) { toast('已生成 ' + r.doc.title, true); renderDocs(S.project.generated_docs || []); }
  else toast(r.error || '生成失败', false);
}

async function fetchDocBody(doc) {
  try {
    const r = await fetch(doc.path.replace('/Users/macbook/CodeBuddy/20260812114859/neuops-agent-demo', ''), { headers: { 'X-Requested-With':'fetch' } });
    return await r.text();
  } catch (e) { return ''; }
}

function renderDocs(docs) {
  const el = document.getElementById('docs-out');
  if (!docs.length) { el.className = 'empty'; el.textContent = '暂无生成成果'; return; }
  el.className = '';
  el.innerHTML = docs.map(d => `
    <div class="file-row">
      <span class="name">📄 ${esc(d.title)} <span style="color:var(--dim);font-size:11px;">${esc(d.type)}</span></span>
      <button class="btn btn-sm" onclick="exportDoc('${d.id}','docx')">下载 docx</button>
      <button class="btn btn-sm" onclick="exportDoc('${d.id}','md')">下载 md</button>
    </div>`).join('');
}

function exportDoc(docId, fmt) {
  window.open(`/api/bid/projects/${S.pid}/export/${docId}?fmt=${fmt}`, '_blank');
}

async function doCheck() {
  const btn = event.target; btn.disabled = true;
  try {
    const r = await api('/api/bid/projects/' + S.pid + '/check', { method:'POST' });
    if (r.success) { toast('自检完成', true); renderCheck(r.result); }
    else toast(r.error || '自检失败', false);
  } finally { btn.disabled = false; }
}

function renderCheck(result) {
  const el = document.getElementById('check-out');
  if (!result || (!(result.unresponded||[]).length && !(result.redlines||[]).length && !(result.scoring||[]).length)) {
    el.innerHTML = '<p style="color:var(--dim);font-size:12px;">尚未执行自检</p>'; return;
  }
  const u = (result.unresponded||[]).map(x => `<div class="item">${esc(x.id||'')} ${esc(x.item)} <span class="result-badge" style="background:rgba(239,68,68,.12);color:var(--danger);">未响应</span></div>`).join('');
  const rl = (result.redlines||[]).map(x => `<div class="item">${esc(x.clause)} <span class="result-badge" style="background:rgba(245,158,11,.12);color:var(--warning);">红线</span> ${esc(x.advice||'')}</div>`).join('');
  const sc = (result.scoring||[]).map(x => `<div class="item">${esc(x.item)} — 建议得分 <b>${x.suggest_score}/${x.full_score}</b> <span style="color:var(--dim);font-size:11px;">${esc(x.advice||'')}</span></div>`).join('');
  el.innerHTML = `
    <div class="sec"><h3>未响应项 <span style="color:var(--danger);">${(result.unresponded||[]).length}</span></h3>${u || '<p>无</p>'}</div>
    <div class="sec"><h3>废标红线 <span style="color:var(--warning);">${(result.redlines||[]).length}</span></h3>${rl || '<p>无</p>'}</div>
    <div class="sec"><h3>评分点得分建议</h3>${sc || '<p>无</p>'}</div>`;
}

showList();
</script>
</body>
</html>

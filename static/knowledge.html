<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理</title>
<style>
:root {
  --bg: #0b1220; --panel: #131c2e; --panel2: #182338; --border: #24324d;
  --text: #dbe4f5; --muted: #7d8db0; --accent: #4f8cff; --accent2: #22d3ee;
  --green: #34d399; --amber: #fbbf24; --red: #f87171; --purple: #a78bfa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 50; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.topbar h1 { font-size: 17px; font-weight: 600; }
.topbar .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all .15s; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { border-color: rgba(248,113,113,.4); color: var(--red); }
.btn.danger:hover { background: rgba(248,113,113,.12); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.wrap { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.kpi .value { font-size: 26px; font-weight: 700; }
.kpi .value.blue { color: var(--accent); } .kpi .value.green { color: var(--green); }
.kpi .value.purple { color: var(--purple); } .kpi .value.amber { color: var(--amber); }
.kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.kb-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.kb-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: .7; }
.kb-card .name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.kb-card .desc { color: var(--muted); font-size: 12px; min-height: 34px; line-height: 1.5; }
.kb-card .stats { display: flex; gap: 10px; }
.stat { background: var(--panel2); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
.stat b { color: var(--text); font-size: 15px; margin-left: 4px; }
.kb-card .emps { display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; background: rgba(167,139,250,.14); color: var(--purple); border: 1px solid rgba(167,139,250,.3); }
.badge.empty { background: rgba(125,141,176,.1); color: var(--muted); border-color: var(--border); }
.kb-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.empty-tip { text-align: center; color: var(--muted); padding: 60px 0; font-size: 13px; }
.hidden { display: none !important; }
/* 弹窗（对齐全站深色毛玻璃风） */
.overlay { position: fixed; inset: 0; background: rgba(2,6,16,.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn .15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #101A2E; border: 1px solid #263350; border-radius: 14px; width: 480px; max-width: 92vw; padding: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: popIn .18s ease; }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal h3 { font-size: 15px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid rgba(38,51,80,.6); }
.modal h3::before { content: ""; width: 4px; height: 16px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--accent2)); flex: none; }
.field { margin-bottom: 14px; }
.field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.field input, .field textarea { width: 100%; background: #0d1526; border: 1px solid #263350; color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.15); }
.field textarea { min-height: 70px; resize: vertical; }
.modal .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.file-drop { border: 1.5px dashed #2a3b5c; border-radius: 10px; padding: 26px; text-align: center; color: var(--muted); cursor: pointer; transition: all .2s; margin-bottom: 14px; background: rgba(11,18,32,.4); }
.file-drop:hover, .file-drop.drag { border-color: var(--accent2); color: var(--accent2); background: rgba(34,211,238,.06); }
.file-drop .big { font-size: 15px; margin-bottom: 6px; }
.file-drop .big { font-size: 15px; margin-bottom: 6px; }
.upload-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 200px; overflow: auto; }
.upload-item { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.upload-item .bar { flex: 1; height: 6px; background: #0d1526; border-radius: 4px; overflow: hidden; }
.upload-item .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.upload-item.ok .bar i { background: var(--green); width: 100% !important; }
.upload-item .st { color: var(--muted); font-size: 12px; white-space: nowrap; }
.upload-item.ok .st { color: var(--green); }
.upload-item.fail .st { color: var(--red); }
/* chunk 查看 */
.chunk-wrap { margin-top: 20px; }
.chunk-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.chunk-item .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
.chunk-item pre { white-space: pre-wrap; word-break: break-all; font-family: inherit; font-size: 13px; line-height: 1.6; color: var(--text); max-height: 180px; overflow: auto; }
.pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0; color: var(--muted); font-size: 13px; }
.back { margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--accent2); font-size: 13px; }
.toast { position: fixed; top: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.toast.ok { border-color: var(--green); } .toast.err { border-color: var(--red); }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">📚</div>
  <div>
    <h1>知识库管理</h1>
    <div class="sub">本地向量知识库 · 上传文档自动解析切块 · RAG 检索来源</div>
  </div>
  <div class="right">
    <button class="btn" onclick="location.href='/'" title="返回智能工作台">← 返回工作台</button>
    <button class="btn primary" onclick="openCreate()">＋ 新建知识库</button>
  </div>
</div>

<div class="wrap" id="listView">
  <div class="kpis">
    <div class="kpi"><div class="label">知识库总数</div><div class="value blue" id="kpiTotal">0</div></div>
    <div class="kpi"><div class="label">文档总数</div><div class="value green" id="kpiDocs">0</div></div>
    <div class="kpi"><div class="label">切块总数</div><div class="value purple" id="kpiChunks">0</div></div>
    <div class="kpi"><div class="label">绑定智能体</div><div class="value amber" id="kpiEmps">0</div></div>
  </div>
  <div class="kb-grid" id="kbGrid"></div>
</div>

<!-- 知识库详情 -->
<div class="wrap hidden" id="detailView">
  <a class="back" onclick="showList()">← 返回知识库列表</a>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
    <h2 style="font-size:18px;" id="dName"></h2>
    <span class="badge" id="dStats"></span>
    <div style="margin-left:auto;display:flex;gap:8px;">
      <button class="btn" onclick="openBind()">绑定智能体</button>
      <button class="btn" onclick="rebuildIndex()">重建索引</button>
      <button class="btn" onclick="openUpload()">上传文件</button>
      <button class="btn danger" onclick="deleteBase()">删除知识库</button>
    </div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;">
    <span style="color:var(--muted);font-size:12px;line-height:24px;">绑定智能体：</span>
    <span id="dEmps"></span>
  </div>
  <div class="chunk-wrap" id="chunkList"></div>
  <div class="pager" id="pager"></div>
</div>

<!-- 上传弹窗 -->
<div class="overlay hidden" id="uploadOverlay">
  <div class="modal" style="width:560px;">
    <h3>上传文件到「<span id="upKbName"></span>」</h3>
    <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
      <div class="big">点击选择 或 拖拽文件到此处</div>
      <div style="font-size:12px;">支持 txt / md / xlsx / pdf / docx，可多选</div>
    </div>
    <input type="file" id="fileInput" multiple accept=".txt,.md,.xlsx,.pdf,.docx" class="hidden">
    <div class="upload-list" id="uploadList"></div>
    <div class="btns">
      <button class="btn" onclick="closeUpload()">关闭</button>
    </div>
  </div>
</div>

<!-- 新建弹窗 -->
<div class="overlay hidden" id="createOverlay">
  <div class="modal">
    <h3>新建知识库</h3>
    <div class="field"><label>名称 *</label><input id="newName" placeholder="例如：运维知识库-告警案例"></div>
    <div class="field"><label>描述</label><textarea id="newDesc" placeholder="说明这个知识库的领域与用途"></textarea></div>
    <div class="btns">
      <button class="btn" onclick="closeCreate()">取消</button>
      <button class="btn primary" onclick="submitCreate()">创建</button>
    </div>
  </div>
</div>

<!-- 绑定弹窗 -->
<div class="overlay hidden" id="bindOverlay">
  <div class="modal">
    <h3>绑定智能体到「<span id="bindKbName"></span>」</h3>
    <div id="bindEmpList"></div>
    <div class="btns">
      <button class="btn" onclick="closeBind()">取消</button>
      <button class="btn primary" onclick="submitBind()">保存绑定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let KBS = [], EMPS = [], CUR = null, CUR_PAGE = 0, PAGE_SIZE = 20, BIND_KB_ID = null;

const $ = id => document.getElementById(id);

function toast(msg, ok = true) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function load() {
  try {
    const [b, e] = await Promise.all([
      api('/api/knowledge/bases'),
      api('/api/employees'),
    ]);
    KBS = b.knowledge_bases || [];
    EMPS = e.employees || [];
    renderList();
  } catch (err) { toast(err.message, false); }
}

function renderList() {
  $('kpiTotal').textContent = KBS.length;
  $('kpiDocs').textContent = KBS.reduce((s, k) => s + (k.doc_count || 0), 0);
  $('kpiChunks').textContent = KBS.reduce((s, k) => s + (k.chunk_count || 0), 0);
  $('kpiEmps').textContent = new Set(KBS.flatMap(k => (k.employees || []).map(e => e.id))).size;

  const grid = $('kbGrid');
  if (!KBS.length) {
    grid.innerHTML = '<div class="empty-tip" style="grid-column:1/-1;">还没有知识库。<br>点击右上角「新建知识库」，然后上传你的文档。</div>';
    return;
  }
  grid.innerHTML = KBS.map(k => `
    <div class="kb-card">
      <div class="name">📖 ${esc(k.name)}</div>
      <div class="desc">${esc(k.description || '暂无描述')}</div>
      <div class="stats">
        <span class="stat">文档<b>${k.doc_count || 0}</b></span>
        <span class="stat">切块<b>${k.chunk_count || 0}</b></span>
      </div>
      <div class="emps">
        ${(k.employees || []).map(e => `<span class="badge">${esc(e.name)}</span>`).join('') || '<span class="badge empty">未绑定智能体</span>'}
      </div>
      <div class="actions">
        <button class="btn primary" onclick="openDetail('${k.id}')">管理</button>
        <button class="btn" onclick="openBind('${k.id}')">绑定</button>
        <button class="btn danger" onclick="deleteBase('${k.id}')">删除</button>
      </div>
    </div>`).join('');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── 新建 ──
function openCreate() { $('createOverlay').classList.remove('hidden'); $('newName').focus(); }
function closeCreate() { $('createOverlay').classList.add('hidden'); }
async function submitCreate() {
  const name = $('newName').value.trim();
  if (!name) return toast('请输入知识库名称', false);
  try {
    const j = await api('/api/knowledge/bases', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: $('newDesc').value.trim() }),
    });
    $('newName').value = ''; $('newDesc').value = '';
    closeCreate(); toast('创建成功');
    await load();
    openDetail(j.knowledge_base.id);
  } catch (e) { toast(e.message, false); }
}

// ── 详情 ──
async function openDetail(id) {
  const k = KBS.find(x => x.id === id);
  if (!k) return;
  CUR = k;
  CUR_PAGE = 0;
  $('listView').classList.add('hidden');
  $('detailView').classList.remove('hidden');
  $('dName').textContent = k.name;
  $('dStats').textContent = `文档 ${k.doc_count || 0} · 切块 ${k.chunk_count || 0}`;
  $('dEmps').innerHTML = (k.employees || []).map(e => `<span class="badge">${esc(e.name)}</span>`).join('') || '<span class="badge empty">未绑定</span>';
  await loadChunks();
}
function showList() { $('detailView').classList.add('hidden'); $('listView').classList.remove('hidden'); load(); }

async function loadChunks() {
  try {
    const j = await api(`/api/knowledge/${CUR.id}/chunks?offset=${CUR_PAGE * PAGE_SIZE}&limit=${PAGE_SIZE}`);
    const total = j.total || 0;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    $('chunkList').innerHTML = (j.chunks || []).map(c => `
      <div class="chunk-item">
        <div class="meta">
          <span>#${c.chunk_index ?? '-'}</span>
          <span>📄 ${esc(c.doc_name)}</span>
          <span style="margin-left:auto;">
            <button class="btn danger" style="padding:3px 10px;font-size:11px;" onclick="deleteChunk('${c.id}')">删除</button>
          </span>
        </div>
        <pre>${esc(c.content)}</pre>
      </div>`).join('') || '<div class="empty-tip">暂无切块，点击右上角「上传文件」</div>';
    $('pager').innerHTML = pages > 1 ? `
      <button class="btn" ${CUR_PAGE === 0 ? 'disabled' : ''} onclick="goPage(${CUR_PAGE - 1})">上一页</button>
      <span>第 ${CUR_PAGE + 1} / ${pages} 页（共 ${total} 条）</span>
      <button class="btn" ${CUR_PAGE >= pages - 1 ? 'disabled' : ''} onclick="goPage(${CUR_PAGE + 1})">下一页</button>` : '';
  } catch (e) { toast(e.message, false); }
}
function goPage(p) { CUR_PAGE = p; loadChunks(); }

async function deleteChunk(id) {
  if (!confirm('确认删除这条切块？')) return;
  try { await api(`/api/knowledge/chunks/${id}`, { method: 'DELETE' }); toast('已删除'); await loadChunks(); await load(); }
  catch (e) { toast(e.message, false); }
}

async function rebuildIndex() {
  if (!confirm('将根据上传目录重建索引，确定？')) return;
  try { const j = await api(`/api/knowledge/${CUR.id}/rebuild`, { method: 'POST' }); toast(`重建完成：文档 ${j.result.doc_count} / 切块 ${j.result.chunk_count}`); await load(); openDetail(CUR.id); }
  catch (e) { toast(e.message, false); }
}

async function deleteBase(id = CUR.id) {
  const k = KBS.find(x => x.id === id);
  if (!confirm(`确认删除知识库「${k ? k.name : ''}」？将同时删除全部向量与上传文件，不可恢复！`)) return;
  try {
    await api(`/api/knowledge/bases/${id}`, { method: 'DELETE' });
    toast('已删除');
    if (CUR && CUR.id === id) { CUR = null; showList(); } else { await load(); }
  } catch (e) { toast(e.message, false); }
}

// ── 上传 ──
function openUpload() {
  if (!CUR) return;
  $('upKbName').textContent = CUR.name;
  $('uploadList').innerHTML = '';
  $('uploadOverlay').classList.remove('hidden');
}
function closeUpload() { $('uploadOverlay').classList.add('hidden'); }

function setupDrop() {
  const drop = $('fileDrop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  $('fileInput').addEventListener('change', e => handleFiles(e.target.files));
}

function handleFiles(files) {
  const list = $('uploadList');
  const tasks = [];
  for (const f of files) {
    const item = document.createElement('div');
    item.className = 'upload-item';
    item.innerHTML = `<span>📄 ${esc(f.name)}</span><div class="bar"><i></i></div><span class="st">排队中</span>`;
    list.appendChild(item);
    const bar = item.querySelector('.bar i');
    const st = item.querySelector('.st');
    const fd = new FormData();
    fd.append('files', f);
    const p = fetch(`/api/knowledge/${CUR.id}/upload`, { method: 'POST', body: fd })
      .then(r => r.json().then(j => ({ ok: r.ok, j })))
      .then(({ ok, j }) => {
        if (!ok) throw new Error(j.error || '上传失败');
        bar.style.width = '100%'; item.classList.add('ok'); st.textContent = '完成';
        toast(`「${f.name}」已入库（切块 ${j.result.chunk_count}）`);
        return true;
      })
      .catch(e => { item.classList.add('fail'); st.textContent = '失败'; toast(e.message, false); return false; });
    tasks.push(p);
  }
  // 全部文件处理完后自动刷新统计与切块列表
  Promise.all(tasks).then(() => {
    toast('上传完成，统计已刷新');
    load();
    if (CUR) loadChunks();
  });
}

// ── 绑定 ──
function openBind(id) {
  id = id || (CUR && CUR.id);
  const k = KBS.find(x => x.id === id);
  if (!k) return toast('未找到该知识库', false);
  BIND_KB_ID = id;
  $('bindKbName').textContent = k.name;
  const curIds = new Set((k.employees || []).map(e => e.id));
  $('bindEmpList').innerHTML = EMPS.map(e => `
    <label style="display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #263350;border-radius:8px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;" onmouseover="this.style.borderColor='rgba(79,140,255,.5)'" onmouseout="this.style.borderColor='#263350'">
      <input type="checkbox" value="${e.id}" ${curIds.has(e.id) ? 'checked' : ''} style="accent-color:var(--accent);">
      <span style="flex:1;">${esc(e.name)}</span>
      <span class="badge">${esc(e.type || '')}</span>
    </label>`).join('') || '<p class="muted">暂无数字员工</p>';
  $('bindOverlay').classList.remove('hidden');
}
function closeBind() { $('bindOverlay').classList.add('hidden'); }
async function submitBind() {
  const id = BIND_KB_ID || (CUR && CUR.id);
  if (!id) return toast('请先选择知识库', false);
  const ids = [...document.querySelectorAll('#bindEmpList input:checked')].map(i => i.value);
  try {
    await api(`/api/knowledge/${id}/bind`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ employee_ids: ids }),
    });
    closeBind(); toast('绑定已保存'); BIND_KB_ID = null; await load();
    // 详情页打开时刷新绑定徽章
    if (CUR && CUR.id === id) openDetail(id);
  } catch (e) { toast(e.message, false); }
}

// 初始化
setupDrop();
load();
</script>
</body>
</html>
